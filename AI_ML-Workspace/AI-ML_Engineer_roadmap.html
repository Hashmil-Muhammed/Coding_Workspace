<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate AI/ML Engineer Career Roadmap</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Fira+Code&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0f172a; --bg-secondary: #1e293b; --bg-glass: rgba(30, 41, 59, 0.7);
            --text-primary: #f8fafc; --text-secondary: #94a3b8;
            --accent-primary: #38bdf8; --accent-secondary: #818cf8; --border-color: rgba(255, 255, 255, 0.1);
            --success: #34d399; --card-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            --gradient: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            --gradient-alt: linear-gradient(135deg, #f43f5e, #fb923c);
            --gradient-success: linear-gradient(135deg, #10b981, #34d399);
        }
        [data-theme="light"] {
            --bg-primary: #f8fafc; --bg-secondary: #ffffff; --bg-glass: rgba(255, 255, 255, 0.8);
            --text-primary: #0f172a; --text-secondary: #475569;
            --accent-primary: #0284c7; --accent-secondary: #4f46e5; --border-color: rgba(0, 0, 0, 0.1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-primary); color: var(--text-primary); overflow-x: hidden; }
        #app { display: flex; height: 100vh; overflow: hidden; }
        
        /* Sidebar */
        .sidebar { width: 340px; background: var(--bg-glass); backdrop-filter: blur(12px); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; overflow-y: auto; padding: 1.5rem; z-index: 10; }
        .logo { font-size: 1.5rem; font-weight: 800; background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 2rem; }
        .nav-item { padding: 1rem; margin-bottom: 0.5rem; border-radius: 12px; cursor: pointer; border: 1px solid transparent; display: flex; justify-content: space-between; align-items: center; }
        .nav-item:hover { background: rgba(255, 255, 255, 0.05); transform: translateX(5px); }
        .nav-item.active { background: var(--gradient); color: #fff; box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3); }
        
        /* Main Content */
        .main-content { flex: 1; overflow-y: auto; padding: 2rem 4rem; scroll-behavior: smooth; }
        .topbar { display: flex; justify-content: space-between; margin-bottom: 2rem; }
        .btn { padding: 0.6rem 1.2rem; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-secondary); color: var(--text-primary); cursor: pointer; font-weight: 600; }
        .btn:hover { background: var(--accent-primary); color: #fff; }
        
        .header-card { background: var(--bg-glass); border: 1px solid var(--border-color); border-radius: 16px; padding: 2rem; margin-bottom: 2rem; }
        .header-title { font-size: 2.5rem; font-weight: 800; color: var(--accent-primary); margin-bottom: 1rem; }
        
        /* Nested Accordion UI */
        .children-list { list-style: none; padding-left: 0; margin-top: 0.5rem; }
        .leaf-node { display: flex; align-items: center; gap: 0.5rem; padding: 0.4rem 0.4rem 0.4rem 1.5rem; font-size: 0.95rem; color: var(--text-secondary); border-left: 2px solid transparent; }
        .leaf-node:hover { color: var(--text-primary); border-left-color: var(--accent-secondary); background: rgba(255,255,255,0.02); }
        .leaf-node .bullet { color: var(--accent-primary); }
        
        .nested-card { margin-top: 0.5rem; border-radius: 8px; border: 1px solid transparent; transition: all 0.2s; border-left: 2px solid var(--border-color); padding-left: 0.5rem; }
        .nested-card.depth-0 { border: 1px solid var(--border-color); background: var(--bg-secondary); margin-bottom: 1.5rem; padding-left: 0; border-left: none; }
        .nested-header { padding: 0.8rem; cursor: pointer; user-select: none; border-radius: 6px; transition: background 0.2s; }
        .nested-header:hover { background: rgba(255,255,255,0.03); }
        .nested-card.depth-0 > .nested-header { padding: 1.2rem; font-size: 1.2rem; background: rgba(0,0,0,0.2); }
        .chevron { display: inline-block; transition: transform 0.3s; font-size: 0.8rem; width: 1.2rem; }
        .nested-card.expanded > .nested-header .chevron { transform: rotate(90deg); }
        .node-title { font-weight: 600; }
        .nested-card.completed > .nested-header .node-title { text-decoration: line-through; opacity: 0.6; }
        .nested-body { padding-left: 1rem; padding-bottom: 0.5rem; display: none; }
        .nested-card.expanded > .nested-body { display: block; animation: fadeIn 0.3s ease; }
        input[type="checkbox"] { width: 1.1rem; height: 1.1rem; accent-color: var(--accent-primary); cursor: pointer; }
        
        .node-details { margin-top: 1rem; padding: 1rem; background: rgba(0,0,0,0.15); border-radius: 8px; border-left: 3px solid var(--accent-secondary); }
        .node-details h5 { color: var(--accent-primary); margin-bottom: 0.5rem; font-size: 0.95rem; }
        .node-details ul { padding-left: 1.2rem; margin-bottom: 1rem; font-size: 0.9rem; color: var(--text-secondary); }
        .tags { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 0.5rem; }
        .tag { background: #0f172a; border: 1px solid var(--border-color); padding: 0.2rem 0.6rem; border-radius: 4px; font-size: 0.8rem; color: var(--accent-primary); }
        
        /* Checklists */
        .checklists-section { margin-top: 3rem; padding: 2rem; background: var(--bg-secondary); border-radius: 12px; border: 1px solid var(--border-color); }
        .checklist-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 2rem; }
        .checklist-col h4 { font-size: 1.1rem; color: var(--accent-primary); margin-bottom: 1rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem; }
        .checklist-item { display: flex; align-items: flex-start; gap: 0.5rem; margin-bottom: 0.8rem; font-size: 0.9rem; color: var(--text-secondary); }
        .checklist-item.checked { text-decoration: line-through; opacity: 0.6; }

        /* Projects */
        .projects-section { margin-top: 3rem; padding-top: 2rem; border-top: 2px dashed var(--border-color); }
        .tier-title { margin: 2rem 0 1rem 0; font-size: 1.5rem; color: #fff; display: flex; align-items: center; gap: 0.5rem; }
        .top5-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem; }
        .top5-card { background: var(--bg-glass); border: 1px solid var(--accent-primary); border-radius: 12px; padding: 1.5rem; position: relative; overflow: hidden; }
        .top5-card.intermediate { border-color: var(--accent-secondary); }
        .top5-card.advanced { border-color: #fb923c; }
        .top5-card::before { content: ''; position: absolute; top:0; left:0; width:100%; height:4px; background: var(--gradient); }
        .top5-card.advanced::before { background: var(--gradient-alt); }
        .top5-number { position: absolute; top: -10px; right: 10px; font-size: 4rem; font-weight: 800; opacity: 0.1; color: var(--text-primary); }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>

// UI Logic
let currentPhaseIndex = 0;
let userProgress = JSON.parse(localStorage.getItem('aiml_roadmap_progress')) || {};

function init() { renderSidebar(); renderPhase(0); }

function renderSidebar() {
    const sidebar = document.getElementById('nav-items');
    sidebar.innerHTML = '';
    roadmapData.forEach((phase, index) => {
        const item = document.createElement('div');
        item.className = `nav-item ${index === currentPhaseIndex ? 'active' : ''}`;
        item.innerHTML = `<div><strong>${phase.phase}</strong><div style="font-size:0.8rem; opacity:0.8">${phase.title.substring(0,25)}...</div></div>`;
        item.onclick = () => { currentPhaseIndex = index; renderSidebar(); renderPhase(index); };
        sidebar.appendChild(item);
    });
}

function renderNode(node, depth, parentPath) {
    if (typeof node === 'string') return `<li class="leaf-node"><span class="bullet">▹</span> ${node}</li>`;
    const path = parentPath ? `${parentPath}-${node.name.replace(/\W+/g, '')}` : node.name.replace(/\W+/g, '');
    const isChecked = userProgress[path] ? 'checked' : '';
    const completedClass = userProgress[path] ? 'completed' : '';
    
    let html = `
        <div class="nested-card depth-${depth} ${completedClass}" id="node-${path}">
            <div class="nested-header" onclick="toggleNode('${path}')">
                <div style="display:flex; align-items:center; gap:0.5rem;">
                    <span class="chevron" id="icon-${path}">▶</span>
                    <input type="checkbox" ${isChecked} onclick="event.stopPropagation(); toggleProgress('${path}')">
                    <span class="node-title">${node.name}</span>
                </div>
            </div>
            <div class="nested-body" id="body-${path}">
    `;
    if (node.children && node.children.length > 0) {
        html += `<ul class="children-list">`;
        node.children.forEach(child => { html += renderNode(child, depth + 1, path); });
        html += `</ul>`;
    }
    if(node.interview || node.practice || node.resources) {
        html += `<div class="node-details">`;
        if (node.interview) html += `<h5>🎤 Interview Prep</h5><ul>${node.interview.map(i => `<li>${i}</li>`).join('')}</ul>`;
        if (node.practice) html += `<h5>💻 Practice</h5><ul>${node.practice.map(p => `<li>${p}</li>`).join('')}</ul>`;
        if (node.resources) html += `<h5>📚 Resources</h5><div class="tags">${node.resources.map(r => `<span class="tag">${r}</span>`).join('')}</div>`;
        html += `</div>`;
    }
    html += `</div></div>`;
    return html;
}

function renderProjects(projectsObj) {
    if(!projectsObj) return '';
    let html = `<div class="projects-section">`;
    const tiers = ['beginner', 'intermediate', 'advanced'];
    tiers.forEach(tier => {
        if(projectsObj[tier] && projectsObj[tier].length > 0) {
            html += `<h3 class="tier-title">Top 5 ${tier.charAt(0).toUpperCase() + tier.slice(1)} Projects</h3><div class="top5-grid">`;
            projectsObj[tier].forEach((p, i) => {
                html += `
                    <div class="top5-card ${tier}">
                        <div class="top5-number">${i+1}</div>
                        <h4>${p.name}</h4>
                        <div style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.5rem;">Key Concepts:</div>
                        <div class="tags">${p.uses.map(u => `<span class="tag tool">${u}</span>`).join('')}</div>
                    </div>
                `;
            });
            html += `</div>`;
        }
    });
    html += `</div>`;
    return html;
}

function renderChecklists(checklists, phaseIndex) {
    if(!checklists) return '';
    let html = `<div class="checklists-section"><h3 style="margin-bottom: 1.5rem; font-size: 1.5rem; color: #fff;">Phase Completion Checklists</h3><div class="checklist-grid">`;
    
    Object.keys(checklists).forEach(category => {
        html += `<div class="checklist-col"><h4>${category.toUpperCase()} CHECKLIST</h4>`;
        checklists[category].forEach((item, i) => {
            const key = `chk-${phaseIndex}-${category}-${i}`;
            const isChecked = userProgress[key] ? 'checked' : '';
            html += `
                <div class="checklist-item ${isChecked}" id="item-${key}">
                    <input type="checkbox" ${isChecked} onchange="toggleChecklist('${key}')">
                    <span>${item}</span>
                </div>
            `;
        });
        html += `</div>`;
    });
    html += `</div></div>`;
    return html;
}

function renderPhase(index) {
    const phase = roadmapData[index];
    if(!phase) { document.getElementById('content-area').innerHTML = `<h2>Under Construction</h2>`; return; }
    let html = `<div class="header-card"><h1 class="header-title">${phase.phase}: ${phase.title}</h1><p style="font-size: 1.1rem; color: var(--text-secondary);">${phase.overview.why}</p></div>`;
    phase.skills.forEach(skill => { html += renderNode(skill, 0, `p${index}`); });
    html += renderProjects(phase.projects);
    html += renderChecklists(phase.checklists, index);
    document.getElementById('content-area').innerHTML = html;
}

function toggleNode(path) { document.getElementById(`node-${path}`).classList.toggle('expanded'); }
function toggleProgress(path) {
    if(userProgress[path]) { delete userProgress[path]; document.getElementById(`node-${path}`).classList.remove('completed'); } 
    else { userProgress[path] = true; document.getElementById(`node-${path}`).classList.add('completed'); }
    localStorage.setItem('aiml_roadmap_progress', JSON.stringify(userProgress));
}
function toggleChecklist(key) {
    if(userProgress[key]) { delete userProgress[key]; document.getElementById(`item-${key}`).classList.remove('checked'); }
    else { userProgress[key] = true; document.getElementById(`item-${key}`).classList.add('checked'); }
    localStorage.setItem('aiml_roadmap_progress', JSON.stringify(userProgress));
}
function toggleTheme() {
    const root = document.documentElement;
    root.setAttribute('data-theme', root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
}
window.onload = init;
